services:
  # Backend API Service
  - type: web
    name: eatwms-backend
    runtime: node
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm ci && npm run build
    startCommand: cd backend && npm run migrate:prod && npm run seed:prod && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://eatwms-frontend.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

  # Frontend Static Site
  - type: web
    name: eatwms-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/build
    env: node
    plan: free
    buildFilter:
      paths:
      - frontend/**
    envVars:
      - key: REACT_APP_API_URL
        value: https://eatwms-backend.onrender.com/api
      - key: GENERATE_SOURCEMAP
        value: false

databases:
  - name: eatwms-db
    databaseName: eatwms
    user: eatwms_user