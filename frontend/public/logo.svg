<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <!-- Premium gradient for the icon -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    
    <!-- Shadow effect -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Modern icon container with rounded corners -->
  <rect x="8" y="8" width="64" height="64" rx="16" ry="16" 
        fill="url(#iconGradient)" filter="url(#softShadow)"/>
  
  <!-- Stylized "E" with modern geometric design -->
  <g fill="white">
    <!-- Main E structure -->
    <rect x="22" y="24" width="6" height="32" rx="1"/>
    <rect x="22" y="24" width="20" height="6" rx="1"/>
    <rect x="22" y="37" width="16" height="5" rx="1"/>
    <rect x="22" y="50" width="20" height="6" rx="1"/>
    
    <!-- Modern accent dots -->
    <circle cx="46" cy="27" r="2" fill="#10b981"/>
    <circle cx="42" cy="39.5" r="1.5" fill="#06b6d4"/>
    <circle cx="46" cy="53" r="2" fill="#10b981"/>
  </g>

  <!-- Company Name: EvoluXion -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- "Evolu" -->
    <text x="88" y="45" font-weight="700" font-size="32" fill="#1f2937" letter-spacing="-0.5px">Evolu</text>
    <!-- "X" with gradient -->
    <text x="205" y="45" font-weight="800" font-size="32" fill="url(#accentGradient)" letter-spacing="-0.5px">X</text>
    <!-- "ion" -->
    <text x="230" y="45" font-weight="700" font-size="32" fill="#1f2937" letter-spacing="-0.5px">ion</text>
  </g>

  <!-- Professional tagline -->
  <text x="88" y="62" font-family="system-ui, -apple-system, sans-serif" 
        font-weight="500" font-size="14" fill="#6b7280" letter-spacing="2px">
    WORKFORCE SOLUTIONS
  </text>

  <!-- Subtle accent line -->
  <rect x="88" y="70" width="60" height="2" rx="1" fill="url(#accentGradient)" opacity="0.6"/>
</svg>
