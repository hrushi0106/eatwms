version: '3.9'

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: eatwms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-eatwms}
      POSTGRES_USER: ${DB_USER:-eatwms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eatwms_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eatwms_user} -d ${DB_NAME:-eatwms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eatwms_net

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eatwms_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - eatwms_net

  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: eatwms_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-eatwms}
      DB_USER: ${DB_USER:-eatwms_user}
      DB_PASSWORD: ${DB_PASSWORD:-eatwms_password}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-jwt-secret-32+chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-change-this-refresh-secret-32+chars}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      STORAGE_PROVIDER: local
      UPLOAD_DIR: /app/uploads
      BCRYPT_ROUNDS: 12
      LOG_LEVEL: info
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "4000:4000"
    networks:
      - eatwms_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: eatwms_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - eatwms_net

  # ─── DB Migration (run-once) ─────────────────────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: eatwms_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-eatwms}
      DB_USER: ${DB_USER:-eatwms_user}
      DB_PASSWORD: ${DB_PASSWORD:-eatwms_password}
    command: ["npx", "knex", "--knexfile", "knexfile.ts", "migrate:latest"]
    networks:
      - eatwms_net
    profiles:
      - migration

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  eatwms_net:
    driver: bridge
